<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Formatter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233f;
      --muted: #61718f;
      --border: #d8e1ef;
      --blue: #1769ee;
      --blue-light: #eef6ff;
      --green: #159768;
      --green-light: #effbf6;
      --purple: #8658e8;
      --purple-light: #f6f1ff;
      --warning: #b86a00;
      --warning-light: #fff7e8;
      --danger: #d93838;
      --danger-light: #fef2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 18px;
      background: #f5f8fc;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    main { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin: 4px 0 28px; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .shield {
      display: inline-grid; place-items: center; width: 44px; height: 44px;
      border-radius: 14px; color: white; background: var(--blue); font-size: 24px;
    }
    h1 { font-size: clamp(28px, 4vw, 38px); margin: 0; letter-spacing: -.7px; }
    header p { color: var(--muted); font-size: 16px; margin: 12px 0 0; line-height: 1.5; }
    .panel {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; margin-bottom: 22px; box-shadow: 0 5px 20px rgba(28, 52, 88, .035);
    }
    label, .section-title { display: block; font-weight: 700; font-size: 16px; }
    textarea, .value {
      width: 100%; border: 1px solid #cbd7e8; border-radius: 8px;
      padding: 13px 14px; font: 20px Consolas, "Courier New", monospace;
      color: var(--ink); background: #fff; outline: none;
    }
    textarea { min-height: 140px; resize: vertical; margin-top: 10px; }
    /* Clickable output display styling without scrolling */
    #plainTextOutput {
      resize: none;
      overflow: hidden;
      min-height: 140px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #plainTextOutput a {
      color: var(--blue);
      text-decoration: underline;
    }
    #plainTextOutput a:hover {
      color: #0e58d2;
    }
    textarea:focus, .value:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #1769ee1c; }
    .input-footer { display: flex; gap: 16px; justify-content: space-between; align-items: center; margin-top: 12px; }
    .button-group { display: flex; gap: 10px; align-items: center; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
    button {
      border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink);
      padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    button:hover { background: #f1f6fd; }
    button:active { transform: translateY(1px); }
    .primary { background: var(--blue); color: #fff; border-color: var(--blue); padding: 13px 20px; }
    .primary:hover { background: #0e58d2; }
    .danger { background: #fff; color: var(--danger); border-color: #fca5a5; padding: 13px 20px; }
    .danger:hover { background: var(--danger-light); border-color: #f87171; }
    .results-heading { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
    .results-heading h2 { font-size: 23px; margin: 0 0 5px; }
    .notice { min-height: 20px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; padding: 0 8px 18px; }
    @media (max-width: 650px) {
      body { padding: 18px 12px; }
      .panel { padding: 17px; }
      .input-footer { align-items: stretch; flex-direction: column; }
      .button-group { width: 100%; justify-content: space-between; }
      .primary, .danger { flex: 1; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="shield" aria-hidden="true">🔒</span><h1>Text Formatter</h1></div>
  </header>

  <section class="panel" aria-labelledby="paste-label">
    <textarea id="sourceText" spellcheck="false" placeholder="Paste text here"></textarea>
    <div class="input-footer">
      <div></div>
      <div class="button-group">
        <button id="deleteButton" class="danger" type="button">Delete All</button>
        <button id="formatButton" class="primary" type="button">✦ Auto Format</button>
      </div>
    </div>
    <div id="message" class="notice" role="status" aria-live="polite"></div>
  </section>

  <section class="panel" aria-labelledby="results-title">
    <div class="results-heading" aria-labelledby="results-title">
      <div class="value" id="plainTextOutput" aria-label="Plain Text Output"></div>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }

  function parseText(raw) {
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return { items: [], message: "Paste some text first." };

    let parsedItems = [];

    for (let line of lines) {
      // 1. Remove $ sign and money amount (e.g., $1,400.01)
      line = line.replace(/\$\s*[\d,]+(?:\.\d+)?/g, "").trim();

      // 2. Find URL and any trailing text after it
      const urlMatch = line.match(/(?:https?:\/\/|www\.)[^\s]*(?:\s+[\s\S]*)?/i);
      let beforeUrl = line;
      let url = "";
      let trailingText = "";

      if (urlMatch) {
        let fullUrlPart = urlMatch[0];
        const spaceIdx = fullUrlPart.search(/\s+/);
        if (spaceIdx !== -1) {
          url = fullUrlPart.slice(0, spaceIdx).replace(/[.,;]+$/, "").trim();
          trailingText = fullUrlPart.slice(spaceIdx).trim();
        } else {
          url = fullUrlPart.replace(/[.,;]+$/, "").trim();
        }
        beforeUrl = line.slice(0, urlMatch.index).trim();
      }

      // 3. Extract email and password from beforeUrl
      const emailRegex = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.(?:com|net|org|edu|gov|mil|int|io|co|us|uk|ca|de|jp|info|biz|me|app|dev|ai)(?=[A-Z0-9]|[\s-]|$)/i;
      const emailMatch = beforeUrl.match(emailRegex);
      let email = "";
      let password = "";

      if (emailMatch) {
        email = emailMatch[0];
        const emailStart = emailMatch.index;
        const emailEnd = emailStart + email.length;
        const beforeEmail = beforeUrl.slice(0, emailStart).trim();
        const afterEmail = beforeUrl.slice(emailEnd).trim();

        password = [beforeEmail, afterEmail].filter(Boolean).join(" ").trim();
      } else {
        password = beforeUrl.trim();
      }

      // Clean password (take first token, keeping the trailing dot if present)
      if (password) {
        password = password.split(/\s+/)[0];
      }

      parsedItems.push({ email, password, url, trailingText });
    }

    return { items: parsedItems, message: "Formatting complete." };
  }

  $("formatButton").addEventListener("click", () => {
    const result = parseText($("sourceText").value);
    
    let htmlBlocks = [];
    for (let item of result.items) {
      const emailHtml = item.email ? `<a href="mailto:${escapeHtml(item.email)}" target="_blank">${escapeHtml(item.email)}</a>` : "";
      const passwordHtml = item.password ? escapeHtml(item.password) : "";
      
      let urlStr = item.url;
      let urlHref = urlStr.match(/^https?:\/\//i) ? urlStr : 'https://' + urlStr;
      const urlHtml = urlStr ? `<a href="${escapeHtml(urlHref)}" target="_blank">${escapeHtml(urlStr)}</a>` : "";
      const trailingHtml = item.trailingText ? escapeHtml(item.trailingText) : "";

      // Combine fields per line with double line breaks (<br><br>)
      let blockParts = [emailHtml, passwordHtml, urlHtml, trailingHtml].filter(Boolean);
      if (blockParts.length > 0) {
        htmlBlocks.push(blockParts.join("<br><br>"));
      }
    }

    // Separate multiple lines/entries with clear spacing
    const formattedOutput = htmlBlocks.join("<br><br><br>");

    const outputEl = $("plainTextOutput");
    outputEl.innerHTML = formattedOutput;
    $("message").textContent = result.message;
  });

  $("deleteButton").addEventListener("click", () => {
    $("sourceText").value = "";
    $("plainTextOutput").innerHTML = "";
    $("message").textContent = "";
    $("sourceText").focus();
  });
</script>
</body>
</html>
